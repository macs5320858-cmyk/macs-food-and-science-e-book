<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Macs Learning Lab — eBook</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f4f1ec;
      color: #2c2c2c;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }
    h1 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
    p  { font-size: 13px; color: #888; margin-bottom: 32px; }
    ul { list-style: none; display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 360px; }
    li a {
      display: block;
      padding: 12px 18px;
      background: #fff;
      border: 1px solid #e0dbd4;
      border-radius: 10px;
      text-decoration: none;
      color: #2c2c2c;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      transition: box-shadow 0.15s;
    }
    li a:hover { box-shadow: 0 3px 10px rgba(0,0,0,0.12); }
  </style>
</head>
<body>
  <h1>Macs Learning Lab</h1>
  <ul id="book-list"></ul>

  <script>
    fetch('books.json')
      .then(r => r.json())
      .then(books => {
        const ul = document.getElementById('book-list');
        books.forEach(b => {
          const li = document.createElement('li');
          const a  = document.createElement('a');
          a.href = 'reader.html?book=' + encodeURIComponent(b.path);
          a.textContent = b.title;
          a.target = '_blank';
          li.appendChild(a);
          ul.appendChild(li);
        });
      });
  </script>
</body>
</html>
