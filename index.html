<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My eBook Library</title>
  <style>
    :root {
      --bg: #f4f1ec;
      --card-bg: #ffffff;
      --text: #2c2c2c;
      --text-muted: #888;
      --accent: #4a90d9;
      --accent-hover: #357abd;
      --border: #e0dbd4;
      --shadow: rgba(0,0,0,0.08);
      --shadow-hover: rgba(0,0,0,0.16);
      --header-bg: #2c2c2c;
      --header-text: #ffffff;
      --tag-bg: #eef4fb;
      --tag-text: #4a90d9;
    }

    .dark {
      --bg: #1a1a2e;
      --card-bg: #16213e;
      --text: #e0e0e0;
      --text-muted: #888;
      --accent: #5ba3f5;
      --accent-hover: #4a90d9;
      --border: #2a3a5a;
      --shadow: rgba(0,0,0,0.3);
      --shadow-hover: rgba(0,0,0,0.5);
      --header-bg: #0f0f1f;
      --header-text: #e0e0e0;
      --tag-bg: #1e2a45;
      --tag-text: #5ba3f5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    /* Header */
    header {
      background: var(--header-bg);
      color: var(--header-text);
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .library-icon {
      font-size: 28px;
    }

    header h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    header p {
      font-size: 12px;
      opacity: 0.6;
      margin-top: 2px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 6px 12px;
      gap: 8px;
    }

    .search-box input {
      background: none;
      border: none;
      outline: none;
      color: var(--header-text);
      font-size: 13px;
      width: 180px;
    }

    .search-box input::placeholder {
      color: rgba(255,255,255,0.4);
    }

    .btn-theme {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      color: var(--header-text);
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.2s;
    }

    .btn-theme:hover {
      background: rgba(255,255,255,0.2);
    }

    /* Main content */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .book-count {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Book grid */
    #book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 24px;
    }

    .book-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 12px var(--shadow);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .book-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px var(--shadow-hover);
    }

    .book-cover {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      display: block;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      position: relative;
      overflow: hidden;
    }

    .book-cover-placeholder {
      width: 100%;
      aspect-ratio: 2/3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 16px;
      text-align: center;
    }

    .book-cover-placeholder .book-emoji {
      font-size: 40px;
    }

    .book-cover-placeholder .cover-title {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
      word-break: keep-all;
    }

    .cover-colors {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }
    .cover-colors:nth-child(3n+1) {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    }
    .cover-colors:nth-child(3n+2) {
      background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
    }
    .cover-colors:nth-child(3n+3) {
      background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
    }

    .book-info {
      padding: 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .book-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .book-author {
      font-size: 12px;
      color: var(--text-muted);
    }

    .book-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 8px;
    }

    .tag {
      background: var(--tag-bg);
      color: var(--tag-text);
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 500;
    }

    .btn-read {
      display: block;
      background: var(--accent);
      color: white;
      text-align: center;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: auto;
      text-decoration: none;
      border-top: 1px solid var(--border);
    }

    .btn-read:hover {
      background: var(--accent-hover);
    }

    /* Empty state */
    #empty-state {
      display: none;
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
    }

    #empty-state .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    #empty-state p {
      font-size: 15px;
    }

    /* Loading */
    #loading-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* Error */
    #error-state {
      display: none;
      background: #fff3f3;
      border: 1px solid #ffcdd2;
      border-radius: 8px;
      padding: 20px;
      color: #c62828;
      font-size: 14px;
      margin: 40px 0;
    }

    @media (max-width: 600px) {
      header { padding: 16px 20px; }
      .search-box { display: none; }
      main { padding: 24px 16px; }
      #book-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <span class="library-icon">📚</span>
      <div>
        <h1>My eBook Library</h1>
        <p>epub 리더</p>
      </div>
    </div>
    <div class="header-right">
      <div class="search-box">
        <span>🔍</span>
        <input type="text" id="search-input" placeholder="제목, 저자 검색..." oninput="filterBooks()">
      </div>
      <button class="btn-theme" onclick="toggleTheme()" id="theme-btn" title="테마 변경">🌙</button>
    </div>
  </header>

  <main>
    <div class="section-header">
      <span class="section-title">전체 도서</span>
      <span class="book-count" id="book-count"></span>
    </div>

    <div id="loading-state">📖 책 목록을 불러오는 중...</div>
    <div id="error-state"></div>
    <div id="book-grid"></div>
    <div id="empty-state">
      <div class="empty-icon">🔍</div>
      <p>검색 결과가 없습니다.</p>
    </div>
  </main>

  <script>
    let allBooks = [];
    const isDarkStored = localStorage.getItem('theme') === 'dark';
    if (isDarkStored) {
      document.body.classList.add('dark');
      document.getElementById('theme-btn').textContent = '☀️';
    }

    // Gradient colors for covers without images
    const gradients = [
      'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
      'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
      'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
      'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
      'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
      'linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%)',
      'linear-gradient(135deg, #fda085 0%, #f6d365 100%)',
      'linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%)',
    ];

    async function loadBooks() {
      try {
        const resp = await fetch('books.json');
        if (!resp.ok) throw new Error('books.json을 불러올 수 없습니다.');
        allBooks = await resp.json();
        renderBooks(allBooks);
        document.getElementById('loading-state').style.display = 'none';
      } catch (err) {
        document.getElementById('loading-state').style.display = 'none';
        const errEl = document.getElementById('error-state');
        errEl.style.display = 'block';
        errEl.textContent = '오류: ' + err.message;
      }
    }

    function renderBooks(books) {
      const grid = document.getElementById('book-grid');
      const empty = document.getElementById('empty-state');
      const countEl = document.getElementById('book-count');

      grid.innerHTML = '';
      countEl.textContent = books.length + '권';

      if (books.length === 0) {
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      books.forEach((book, idx) => {
        const card = document.createElement('div');
        card.className = 'book-card';

        // Cover
        const coverDiv = document.createElement('div');
        if (book.cover) {
          const img = document.createElement('img');
          img.src = book.cover;
          img.alt = book.title;
          img.className = 'book-cover';
          img.onerror = () => {
            img.replaceWith(makePlaceholderCover(book, idx));
          };
          coverDiv.appendChild(img);
        } else {
          coverDiv.appendChild(makePlaceholderCover(book, idx));
        }

        // Info
        const infoDiv = document.createElement('div');
        infoDiv.className = 'book-info';

        const titleEl = document.createElement('div');
        titleEl.className = 'book-title';
        titleEl.textContent = book.title;

        const authorEl = document.createElement('div');
        authorEl.className = 'book-author';
        authorEl.textContent = book.author || '';

        infoDiv.appendChild(titleEl);
        infoDiv.appendChild(authorEl);

        if (book.tags && book.tags.length) {
          const tagsDiv = document.createElement('div');
          tagsDiv.className = 'book-tags';
          book.tags.forEach(tag => {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = tag;
            tagsDiv.appendChild(span);
          });
          infoDiv.appendChild(tagsDiv);
        }

        // Read button
        const readBtn = document.createElement('a');
        readBtn.className = 'btn-read';
        readBtn.textContent = '읽기 →';
        readBtn.href = 'reader.html?book=' + encodeURIComponent(book.path);

        card.appendChild(coverDiv);
        card.appendChild(infoDiv);
        card.appendChild(readBtn);

        grid.appendChild(card);
      });
    }

    function makePlaceholderCover(book, idx) {
      const div = document.createElement('div');
      div.className = 'book-cover-placeholder';
      div.style.background = gradients[idx % gradients.length];

      const emoji = document.createElement('span');
      emoji.className = 'book-emoji';
      emoji.textContent = '📖';

      const title = document.createElement('span');
      title.className = 'cover-title';
      title.textContent = book.title;

      div.appendChild(emoji);
      div.appendChild(title);
      return div;
    }

    function filterBooks() {
      const q = document.getElementById('search-input').value.trim().toLowerCase();
      if (!q) {
        renderBooks(allBooks);
        return;
      }
      const filtered = allBooks.filter(b =>
        b.title.toLowerCase().includes(q) ||
        (b.author && b.author.toLowerCase().includes(q)) ||
        (b.tags && b.tags.some(t => t.toLowerCase().includes(q)))
      );
      renderBooks(filtered);
    }

    function toggleTheme() {
      const dark = document.body.classList.toggle('dark');
      document.getElementById('theme-btn').textContent = dark ? '☀️' : '🌙';
      localStorage.setItem('theme', dark ? 'dark' : 'light');
    }

    loadBooks();
  </script>
</body>
</html>
